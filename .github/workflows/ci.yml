name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Signal Relay tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test Signal Relay
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest
        working-directory: services/signal-relay

      - name: Validate Compose manifest
        run: docker compose -f services/signal-relay/compose.yaml config --quiet

  site:
    name: Site check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, test, and build site
        run: npm run verify
        env:
          # The default read-only token avoids unauthenticated GitHub API rate limits during the build.
          GITHUB_TOKEN: ${{ github.token }}
          # Public site key (not a secret): read from the repository variable only; this workflow references no secrets.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

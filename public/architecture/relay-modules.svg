<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" role="img" aria-label="Modules of the signal_relay package and their external dependencies"><style>
:root{--bg:#fff;--panel:#fff;--ink:#1b1d1f;--muted:#5d6368;--line:#c9c6bc;--accent:#2b6cb0;--accent2:#b7791f;--ok:#2f855a;--warn:#c05621;--chip:#eceae3}
@media (prefers-color-scheme:dark){:root{--bg:#0f1214;--panel:#171b1e;--ink:#e8eaec;--muted:#9aa3a9;--line:#2b3238;--accent:#63b3ed;--accent2:#ecc94b;--ok:#68d391;--warn:#f6ad55;--chip:#222a2f}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink);font-size:13px}
.t2{fill:var(--muted);font-size:11.5px}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.3}
.hi{fill:var(--chip);stroke:var(--accent);stroke-width:1.5}.hi2{fill:var(--chip);stroke:var(--accent2);stroke-width:1.5}.hi3{fill:var(--chip);stroke:var(--ok);stroke-width:1.5}.hi4{fill:var(--chip);stroke:var(--warn);stroke-width:1.5}
.zone{fill:none;stroke:var(--line);stroke-dasharray:5 4;stroke-width:1.2}
.ln{stroke:var(--muted);stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 4}
</style><rect x="0" y="0" width="100%" height="100%" fill="var(--bg)"/>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>
  <rect class="hi" x="20" y="130" width="190" height="100" rx="10"/><text x="36" y="158" style="font-weight:600">app.py</text><text x="36" y="178" class="t2">FastAPI · routes · CORS</text><text x="36" y="194" class="t2">allowed origin · lifespan</text><text x="36" y="210" class="t2">WebSocket /v1/events</text>
  <rect class="box" x="280" y="20" width="200" height="56" rx="8"/><text x="294" y="44">config.py</text><text x="294" y="62" class="t2">Settings + startup validation</text>
  <rect class="box" x="280" y="96" width="200" height="56" rx="8"/><text x="294" y="120">bridge.py</text><text x="294" y="138" class="t2">LXMF, inbox, lab sessions, events</text>
  <rect class="box" x="280" y="172" width="200" height="56" rx="8"/><text x="294" y="196">home_assistant.py</text><text x="294" y="214" class="t2">HA / Meshtastic clients, cache</text>
  <rect class="box" x="280" y="248" width="200" height="56" rx="8"/><text x="294" y="272">printer.py + gcode_model.py</text><text x="294" y="290" class="t2">Moonraker, model thread, G-code parser</text>
  <rect class="box" x="280" y="318" width="200" height="34" rx="8"/><text x="294" y="340">metrics · telegram · lab_sender</text>
  <rect class="hi3" x="580" y="20" width="220" height="46" rx="8"/><text x="594" y="48">SIGNAL_RELAY_* variables</text>
  <rect class="hi3" x="580" y="96" width="220" height="56" rx="8"/><text x="594" y="120">Reticulum / LXMF</text><text x="594" y="138" class="t2">/reticulum + /data volumes</text>
  <rect class="hi3" x="580" y="172" width="220" height="56" rx="8"/><text x="594" y="196">Home Assistant (via nginx)</text><text x="594" y="214" class="t2">sensors + Meshtastic · 1 event</text>
  <rect class="hi3" x="580" y="248" width="220" height="56" rx="8"/><text x="594" y="272">Moonraker (via nginx)</text><text x="594" y="290" class="t2">4 fixed requests, GET only</text>
  <rect class="hi3" x="580" y="318" width="220" height="34" rx="8"/><text x="594" y="340">Prometheus · Telegram · Turnstile</text>
  <rect class="hi2" x="860" y="96" width="180" height="108" rx="10"/><text x="876" y="124" style="font-weight:600">Container</text><text x="876" y="144" class="t2">read_only · cap_drop ALL</text><text x="876" y="160" class="t2">no host port</text><text x="876" y="176" class="t2">external destaben-edge network</text><text x="876" y="192" class="t2">healthcheck /healthz</text>

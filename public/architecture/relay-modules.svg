  <path class="ln" marker-end="url(#ar2)" d="M210 205 C245 230 245 270 280 276"/>
  <path class="ln" marker-end="url(#ar2)" d="M210 220 C240 280 250 330 280 335"/>
  <path class="ln dash" marker-end="url(#ar2)" d="M480 48 L580 43"/>
  <path class="ln" marker-end="url(#ar2)" d="M480 124 L580 124"/>
  <path class="ln" marker-end="url(#ar2)" d="M480 200 L580 200"/>

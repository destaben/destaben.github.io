worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Only POST requests consume the shared lab budget; status polling remains free.
  map $request_method $lab_rate_key {
    default "";
    POST $binary_remote_addr;
  }

  limit_req_zone $lab_rate_key zone=reticulum_lab:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=per_client:10m;

  upstream signal_relay {
    server signal-relay:8787;
  }

  server {
    listen 8080;
    server_name _;

    # Nginx is reachable only from cloudflared and the host loopback binding.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;
    real_ip_recursive on;

    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_conn per_client 10;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;

    location = /healthz {
      proxy_pass http://signal_relay;
    }

    location = /v1/contact {
      proxy_pass http://signal_relay;
    }

    location = /v1/inbox {
      proxy_pass http://signal_relay;
    }

    location = /v1/lab/capabilities {
      proxy_pass http://signal_relay;
    }

    location = /v1/lab/sessions {
      limit_req zone=reticulum_lab burst=2 nodelay;
      limit_req_status 429;
      proxy_pass http://signal_relay;
    }

    location /v1/lab/sessions/ {
      limit_req zone=reticulum_lab burst=2 nodelay;
      limit_req_status 429;
      proxy_pass http://signal_relay;
    }

    location / {
      return 404;
    }
  }
}
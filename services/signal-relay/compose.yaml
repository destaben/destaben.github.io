services:
  signal-relay:
    container_name: reticulum-relay
    image: ghcr.io/destaben/signal-relay:latest
    pull_policy: always
    environment:
      SIGNAL_RELAY_MODE: reticulum
      SIGNAL_RELAY_ALLOWED_ORIGINS: https://info.destaben.dev
      SIGNAL_RELAY_RATE_LIMIT: ${SIGNAL_RELAY_RATE_LIMIT:-10}
      SIGNAL_RELAY_RATE_WINDOW_SECONDS: ${SIGNAL_RELAY_RATE_WINDOW_SECONDS:-60}
      SIGNAL_RELAY_RETICULUM_CONFIG_DIR: /reticulum
      SIGNAL_RELAY_LAB_SEND_ENABLED: ${SIGNAL_RELAY_LAB_SEND_ENABLED:-false}
      SIGNAL_RELAY_LAB_SENDER_CONFIG_DIR: /lab-sender-reticulum
      SIGNAL_RELAY_STORAGE_DIR: /data
      SIGNAL_RELAY_TELEGRAM_BOT_TOKEN: ${SIGNAL_RELAY_TELEGRAM_BOT_TOKEN:-}
      SIGNAL_RELAY_TELEGRAM_CHAT_ID: ${SIGNAL_RELAY_TELEGRAM_CHAT_ID:-}
      SIGNAL_RELAY_PROMETHEUS_URL: ${SIGNAL_RELAY_PROMETHEUS_URL:-http://host.docker.internal:9090}
      SIGNAL_RELAY_HOME_ASSISTANT_URL: ${SIGNAL_RELAY_HOME_ASSISTANT_URL:-http://nginx:8081}
      SIGNAL_RELAY_HOME_ASSISTANT_TOKEN: ${SIGNAL_RELAY_HOME_ASSISTANT_TOKEN:-}
      SIGNAL_RELAY_HOME_ASSISTANT_TEMPERATURE_ENTITY_ID: ${SIGNAL_RELAY_HOME_ASSISTANT_TEMPERATURE_ENTITY_ID:-}
      SIGNAL_RELAY_HOME_ASSISTANT_HUMIDITY_ENTITY_ID: ${SIGNAL_RELAY_HOME_ASSISTANT_HUMIDITY_ENTITY_ID:-}
      SIGNAL_RELAY_HOME_ASSISTANT_AIR_QUALITY_ENTITY_ID: ${SIGNAL_RELAY_HOME_ASSISTANT_AIR_QUALITY_ENTITY_ID:-}
      SIGNAL_RELAY_HOME_ASSISTANT_CACHE_SECONDS: ${SIGNAL_RELAY_HOME_ASSISTANT_CACHE_SECONDS:-900}
      SIGNAL_RELAY_PUBLIC_TCP_NODE_ALIASES: "${SIGNAL_RELAY_PUBLIC_TCP_NODE_ALIASES:-{}}"
    networks:
      - relay
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./reticulum:/reticulum
      - ./lab-sender-reticulum:/lab-sender-reticulum
      - signal-relay-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8787/healthz').status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    container_name: lab-edge
    image: nginxinc/nginx-unprivileged:stable-alpine
    pull_policy: always
    depends_on:
      signal-relay:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge
      - relay
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    container_name: reticulum-tunnel
    image: cloudflare/cloudflared:latest
    pull_policy: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - edge
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  signal-relay-data:

networks:
  edge:
    name: destaben-edge
  relay: